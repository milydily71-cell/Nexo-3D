name: Nexo-3D Android NDK

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    name: Android arm64-v8a native bridge build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018
      - name: Configure with Android NDK
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
          -DNEXO_ENABLE_VULKAN=ON
          -DNEXO_BUILD_TESTS=OFF
      - name: Build native engine and JNI host library
        run: cmake --build build-android --parallel 2
